name: Reactivate DQ audit batch (one-off, 2026-09-24)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  reactivate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reactivate
        env:
          BREEZY_EMAIL: ${{ secrets.BREEZY_EMAIL }}
          BREEZY_PASSWORD: ${{ secrets.BREEZY_PASSWORD }}
        run: node scripts/reactivate_dq_audit_batch.js
      - name: Commit log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dq_audit_reactivations.json
          git diff --staged --quiet || git commit -m "Log DQ-audit batch reactivations"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected (attempt $i/5) - fetching and rebasing before retry..."
            git fetch origin main
            git rebase origin/main
            sleep $((i * 3))
          done
