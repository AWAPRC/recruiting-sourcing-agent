name: Daily candidate check (replies + new roles)

on:
  workflow_dispatch: {}
  schedule:
    # Runs every day at 13:00 UTC (~9am ET). GitHub fires this automatically,
    # no manual trigger needed once this file is on the main branch.
    - cron: '0 13 * * *'

jobs:
  daily-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check for candidate replies
        env:
          BREEZY_EMAIL: ${{ secrets.BREEZY_EMAIL }}
          BREEZY_PASSWORD: ${{ secrets.BREEZY_PASSWORD }}
        run: node scripts/check_replies.js
      - name: Check for new published roles
        env:
          BREEZY_EMAIL: ${{ secrets.BREEZY_EMAIL }}
          BREEZY_PASSWORD: ${{ secrets.BREEZY_PASSWORD }}
        run: node scripts/check_new_roles.js
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Daily check: $(date -u +%Y-%m-%d)"
          git push
