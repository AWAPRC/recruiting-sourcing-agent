name: Send outreach (Modeline + Tamar)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Send outreach
        env:
          BREEZY_EMAIL: ${{ secrets.BREEZY_EMAIL }}
          BREEZY_PASSWORD: ${{ secrets.BREEZY_PASSWORD }}
        run: node scripts/send_outreach.js
      - name: Commit sent log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sent_outreach.json
          git diff --staged --quiet || git commit -m "Log sent outreach"
          git push
