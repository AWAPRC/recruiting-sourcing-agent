name: Scan DQ'd candidate resumes for Spanish/bilingual mentions

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pdf-parse
        run: npm install pdf-parse@1.1.1 --no-save
      - name: Scan resumes
        env:
          BREEZY_EMAIL: ${{ secrets.BREEZY_EMAIL }}
          BREEZY_PASSWORD: ${{ secrets.BREEZY_PASSWORD }}
        run: node scripts/scan_resumes_spanish.js
      - name: Commit results
        run: |
          git config user.name  "recruiting-agent-bot"
          git config user.email "recruiting-agent-bot@users.noreply.github.com"
          git add data/resume_spanish_scan.json data/dq_candidates_to_check.json || true
          git commit -m "Scan resumes for Spanish mentions $(TZ=America/New_York date +'%F %H:%M ET')" || echo "no changes"
          git push || echo "nothing to push"
