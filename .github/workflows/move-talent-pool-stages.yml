name: Move Talent Pool candidates to stage

on:
  workflow_dispatch: {}

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run stage moves
        env:
          BREEZY_EMAIL: ${{ secrets.BREEZY_EMAIL }}
          BREEZY_PASSWORD: ${{ secrets.BREEZY_PASSWORD }}
        run: node scripts/move_talent_pool_stages.js
