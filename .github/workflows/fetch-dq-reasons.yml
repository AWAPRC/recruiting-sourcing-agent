name: Audit DQ reasons (one-off, 2026-09-21)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Fetch DQ reasons
        env:
          BREEZY_EMAIL: ${{ secrets.BREEZY_EMAIL }}
          BREEZY_PASSWORD: ${{ secrets.BREEZY_PASSWORD }}
        run: node scripts/fetch_dq_reasons.js
      - name: Commit results
        run: |
          git config user.name  "recruiting-agent-bot"
          git config user.email "recruiting-agent-bot@users.noreply.github.com"
          git add data/dq_audit_results_2026-09-21.json || true
          git commit -m "DQ audit results $(TZ=America/New_York date +'%F %H:%M ET')" || echo "no changes"
          git push || echo "nothing to push"
