name: Pull Review Batch from Breezy

# Manually triggered. Pulls every OPEN position and every candidate in Applied, Phone
# Screening, PII, or A-Player stages across ALL open roles, and commits the result back
# to the repo for Claude to review against each role's hiring guide.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with: { node-version: '24' }

      - name: Pull review batch from Breezy
        env:
          BREEZY_EMAIL:    ${{ secrets.BREEZY_EMAIL }}
          BREEZY_PASSWORD: ${{ secrets.BREEZY_PASSWORD }}
        run: |
          set -e
          DATE=$(TZ=America/New_York date +%F)
          node scripts/get_review_batch.js "$DATE"

      - name: Commit pulled data back
        run: |
          git config user.name  "recruiting-agent-bot"
          git config user.email "recruiting-agent-bot@users.noreply.github.com"
          git add data/ || true
          git commit -m "Pull review batch $(TZ=America/New_York date +'%F %H:%M ET')" || echo "no changes"
          git push || echo "nothing to push"
