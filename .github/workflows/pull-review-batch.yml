name: Pull Review Batch from Breezy

# Runs automatically every morning (13:05 UTC) and can also be triggered manually.
# Pulls every OPEN position and every candidate in Applied, Phone Screening, PII,
# or A-Player stages across ALL open roles, and commits the result back to the
# repo for Claude to review against each role hiring guide.

on:
  workflow_dispatch: {}
  schedule:
    # Runs every day at 13:05 UTC (~9:05am ET), 5 minutes after daily-check.yml,
    # so the candidate review batch is always fresh before Devanne's morning
    # scheduled check-in (which fires at 14:00 UTC).
    - cron: '5 13 * * *'

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with: { node-version: '24' }

      - name: Pull review batch from Breezy
        env:
          BREEZY_EMAIL:    ${{ secrets.BREEZY_EMAIL }}
          BREEZY_PASSWORD: ${{ secrets.BREEZY_PASSWORD }}
        run: |
          set -e
          DATE=$(TZ=America/New_York date +%F)
          node scripts/get_review_batch.js "$DATE"

      - name: Commit pulled data back
        run: |
          git config user.name  "recruiting-agent-bot"
          git config user.email "recruiting-agent-bot@users.noreply.github.com"
          git add data/ || true
          git commit -m "Pull review batch $(TZ=America/New_York date +'%F %H:%M ET')" || echo "no changes"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected (attempt $i/5) - fetching and rebasing before retry..."
            git fetch origin main
            git rebase origin/main
            sleep $((i * 3))
          done
