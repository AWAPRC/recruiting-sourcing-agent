name: Check phone-screen history before reactivating (one-off 2026-09-24)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check phone screen history
        env:
          BREEZY_EMAIL: ${{ secrets.BREEZY_EMAIL }}
          BREEZY_PASSWORD: ${{ secrets.BREEZY_PASSWORD }}
        run: node scripts/check_phone_screen_history.js
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/phone_screen_history_check.json
          git diff --staged --quiet || git commit -m "Check phone-screen/interview history for DQ audit batch"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected (attempt $i/5) - fetching and rebasing before retry..."
            git fetch origin main
            git rebase origin/main
            sleep $((i * 3))
          done
